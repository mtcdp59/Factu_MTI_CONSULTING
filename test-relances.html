<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Relances Automatiques</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 40px;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 16px;
        }
        
        .section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #555;
        }
        
        input[type="text"],
        input[type="date"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: white;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            user-select: none;
        }
        
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .btn-success:hover {
            background: #059669;
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .result {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }
        
        .result.success {
            background: #d1fae5;
            border: 2px solid #10b981;
            color: #065f46;
        }
        
        .result.error {
            background: #fee2e2;
            border: 2px solid #ef4444;
            color: #991b1b;
        }
        
        .result.info {
            background: #dbeafe;
            border: 2px solid #3b82f6;
            color: #1e40af;
        }
        
        .history-item {
            background: white;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid #667eea;
        }
        
        .history-item strong {
            color: #667eea;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge-level1 { background: #fef3c7; color: #92400e; }
        .badge-level2 { background: #fed7aa; color: #9a3412; }
        .badge-level3 { background: #fecaca; color: #991b1b; }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔔 Test Relances Automatiques</h1>
        <p class="subtitle">Interface de test pour la fonctionnalité de relances automatiques</p>
        
        <!-- Section 1: Configuration Backend -->
        <div class="section">
            <div class="section-title">⚙️ Configuration</div>
            <div class="form-group">
                <label>URL Backend</label>
                <input type="text" id="backendUrl" placeholder="https://script.google.com/macros/s/...">
            </div>
        </div>
        
        <!-- Section 2: Créer une facture de test -->
        <div class="section">
            <div class="section-title">📄 Créer Facture de Test</div>
            
            <div class="form-group">
                <label>Numéro Facture</label>
                <input type="text" id="invoiceNumber" placeholder="ex: FAC-2025-001">
            </div>
            
            <div class="form-group">
                <label>Client</label>
                <input type="text" id="clientName" placeholder="ex: Entreprise ABC">
            </div>
            
            <div class="form-group">
                <label>Email Client</label>
                <input type="text" id="clientEmail" placeholder="client@exemple.com">
            </div>
            
            <div class="form-group">
                <label>Montant (€)</label>
                <input type="number" id="amount" placeholder="1500" step="0.01">
            </div>
            
            <div class="form-group">
                <label>Date Échéance</label>
                <input type="date" id="dueDate">
            </div>
            
            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="noAutoRelance">
                    <label for="noAutoRelance">🔕 Ne pas relancer automatiquement</label>
                </div>
            </div>
            
            <button class="btn btn-success" onclick="createTestInvoice()">
                ✅ Créer Facture de Test
            </button>
            
            <div id="createResult" class="result"></div>
        </div>
        
        <!-- Section 3: Déclencher relances -->
        <div class="section">
            <div class="section-title">🚀 Actions</div>
            
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="checkRelances()">
                    🔍 Vérifier et Envoyer Relances
                </button>
                
                <button class="btn btn-secondary" onclick="sendManualRelance()">
                    📧 Relance Manuelle
                </button>
            </div>
            
            <div class="form-group" style="margin-top: 20px;">
                <label>Facture à relancer (manuelle)</label>
                <input type="text" id="manualInvoiceNumber" placeholder="ex: FAC-2025-001">
            </div>
            
            <div class="form-group">
                <label>Niveau de relance</label>
                <select id="manualLevel">
                    <option value="1">Niveau 1 - Rappel courtois</option>
                    <option value="2">Niveau 2 - Relance ferme</option>
                    <option value="3">Niveau 3 - Mise en demeure</option>
                </select>
            </div>
            
            <div id="actionResult" class="result"></div>
        </div>
        
        <!-- Section 4: Historique -->
        <div class="section">
            <div class="section-title">📋 Historique des Relances</div>
            <div id="historyContainer">
                <p style="color: #999; text-align: center;">Aucune relance pour le moment</p>
            </div>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 16px; color: #666;">Traitement en cours...</p>
        </div>
    </div>
    
    <script>
        // Charger l'URL du backend depuis config.js si disponible
        if (typeof CONFIG !== 'undefined' && CONFIG.BACKEND_URL) {
            document.getElementById('backendUrl').value = CONFIG.BACKEND_URL;
        }
        
        // Définir date d'échéance par défaut (J-10 pour simuler retard)
        const defaultDueDate = new Date();
        defaultDueDate.setDate(defaultDueDate.getDate() - 10);
        document.getElementById('dueDate').value = defaultDueDate.toISOString().split('T')[0];
        
        function showResult(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.className = 'result ' + type;
            el.textContent = message;
            el.style.display = 'block';
            
            setTimeout(() => {
                el.style.display = 'none';
            }, 5000);
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
        
        async function callBackend(action, data) {
            const backendUrl = document.getElementById('backendUrl').value;
            if (!backendUrl) {
                throw new Error('URL Backend non configurée');
            }
            
            showLoading(true);
            
            try {
                // Utiliser GET pour éviter CORS preflight (simple request)
                const params = new URLSearchParams({
                    action: action,
                    data: JSON.stringify(data)
                });
                
                const response = await fetch(backendUrl + '?' + params.toString(), {
                    method: 'GET'
                });
                
                const result = await response.json();
                return result;
            } finally {
                showLoading(false);
            }
        }
        
        async function createTestInvoice() {
            try {
                const invoice = {
                    number: document.getElementById('invoiceNumber').value,
                    client: document.getElementById('clientName').value,
                    clientEmail: document.getElementById('clientEmail').value,
                    total: parseFloat(document.getElementById('amount').value),
                    dueDate: document.getElementById('dueDate').value,
                    date: new Date().toISOString().split('T')[0],
                    status: 'En attente',
                    noAutoRelance: document.getElementById('noAutoRelance').checked,
                    relances: []
                };
                
                if (!invoice.number || !invoice.client || !invoice.clientEmail || !invoice.total || !invoice.dueDate) {
                    showResult('createResult', '⚠️ Tous les champs sont obligatoires', 'error');
                    return;
                }
                
                // Simuler l'ajout (dans un vrai cas, on utiliserait saveToDrive)
                console.log('Facture de test créée:', invoice);
                showResult('createResult', '✅ Facture de test créée ! (voir console)', 'success');
                
            } catch (error) {
                showResult('createResult', '❌ Erreur: ' + error.message, 'error');
            }
        }
        
        async function checkRelances() {
            try {
                const result = await callBackend('checkRelances', {});
                
                if (result.success) {
                    showResult('actionResult', '✅ ' + result.message, 'success');
                    loadHistory();
                } else {
                    showResult('actionResult', '❌ ' + result.message, 'error');
                }
            } catch (error) {
                showResult('actionResult', '❌ Erreur: ' + error.message, 'error');
            }
        }
        
        async function sendManualRelance() {
            try {
                const invoiceNumber = document.getElementById('manualInvoiceNumber').value;
                const level = parseInt(document.getElementById('manualLevel').value);
                
                if (!invoiceNumber) {
                    showResult('actionResult', '⚠️ Numéro de facture requis', 'error');
                    return;
                }
                
                const result = await callBackend('sendRelance', {
                    invoiceNumber: invoiceNumber,
                    level: level
                });
                
                if (result.success) {
                    showResult('actionResult', '✅ Relance envoyée !', 'success');
                    loadHistory();
                } else {
                    showResult('actionResult', '❌ ' + result.message, 'error');
                }
            } catch (error) {
                showResult('actionResult', '❌ Erreur: ' + error.message, 'error');
            }
        }
        
        async function loadHistory() {
            // Dans un vrai cas, on chargerait les données depuis Drive
            // Pour le test, on affiche un message
            const container = document.getElementById('historyContainer');
            container.innerHTML = '<p style="color: #10b981;">✅ Historique mis à jour - Vérifiez les logs du backend</p>';
        }
        
        // Charger config.js si disponible
        const script = document.createElement('script');
        script.src = 'config.js';
        script.onerror = () => {
            console.log('config.js non trouvé, veuillez saisir l\'URL backend manuellement');
        };
        document.head.appendChild(script);
    </script>
</body>
</html>
